server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ $uri/index.html =404;
    }

    location ~ ^/(?:media|downloads)/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location ~* \.(?:css|js|svg)$ {
        expires 1h;
        try_files $uri =404;
    }

    error_page 404 /404.html;
}
